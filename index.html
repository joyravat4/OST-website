<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncBoard - Collaborative Canvas & Code Scratchpad</title>

  <!-- Tailwind CSS via CDN (no build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="h-screen flex flex-col bg-slate-900 text-slate-100">

  <!-- ============ TOP BAR: title, room, presence, export ============ -->
  <header class="flex flex-wrap items-center justify-between gap-2 px-4 py-2 bg-slate-800 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-bold">SyncBoard</h1>
      <span class="text-sm text-slate-400">Room:
        <span id="room-name" class="font-mono text-sky-300"></span>
      </span>
      <button id="copy-link" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">Copy invite link</button>
    </div>

    <div class="flex items-center gap-4 text-sm">
      <!-- Connection status dot -->
      <span class="flex items-center gap-1">
        <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-red-500"></span>
        <span id="status-text" class="text-slate-400">Connecting...</span>
      </span>
      <!-- Presence counter -->
      <span class="px-2 py-1 rounded bg-slate-700">
        👥 <span id="user-count" class="font-semibold">0</span> online
      </span>
      <!-- Export buttons -->
      <button id="export-png" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500">Export PNG</button>
      <button id="export-json" class="px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500">Export JSON</button>
    </div>
  </header>

  <!-- ============ MAIN SPLIT VIEW ============ -->
  <main class="flex-1 flex flex-col md:flex-row min-h-0">

    <!-- LEFT: canvas + toolbar -->
    <section class="md:w-3/5 flex flex-col min-h-0 border-b md:border-b-0 md:border-r border-slate-700">
      <div class="flex flex-wrap items-center gap-3 px-3 py-2 bg-slate-800">
        <button id="tool-pen" class="tool-btn active" title="Pen">✏️ Pen</button>
        <button id="tool-eraser" class="tool-btn" title="Eraser">🧽 Eraser</button>

        <label class="flex items-center gap-1 text-sm">Color
          <input id="color-picker" type="color" value="#1e293b" class="w-8 h-8 p-0 border-0 bg-transparent cursor-pointer" />
        </label>

        <label class="flex items-center gap-2 text-sm">Size
          <input id="brush-size" type="range" min="1" max="40" value="4" />
          <span id="brush-size-label" class="w-6 text-right font-mono">4</span>
        </label>

        <button id="clear-canvas" class="ml-auto px-3 py-1 text-sm rounded bg-red-600 hover:bg-red-500">Clear Canvas</button>
      </div>

      <!-- The canvas is a fixed 1600x900 "logical" board, scaled by CSS -->
      <div class="flex-1 overflow-auto bg-slate-700 p-2 min-h-0">
        <canvas id="board" width="1600" height="900"
                class="w-full h-auto bg-white rounded shadow-lg"></canvas>
      </div>
    </section>

    <!-- RIGHT: shared code / notes pad -->
    <section class="md:w-2/5 flex flex-col min-h-0">
      <div class="px-3 py-2 bg-slate-800 text-sm text-slate-300">
        Shared Code / Notes Pad <span class="text-slate-500">(syncs live)</span>
      </div>
      <textarea id="code-pad" spellcheck="false"
        class="flex-1 w-full p-3 font-mono text-sm bg-slate-950 text-emerald-200 outline-none resize-none"
        placeholder="// Type code or notes here. Everyone in the room sees it live..."></textarea>
    </section>
  </main>

  <!-- Socket.io client is auto-served by the Socket.io server at this path -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
